<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Teste upload iOS</title><style>body{margin:0;padding:28px;background:#07080d;color:#fff;font-family:system-ui}h1{font-size:20px}p{color:#aaa;line-height:1.5}.box{margin:20px 0;padding:18px;border:1px solid #333;border-radius:14px;background:#11141d}input[type=file]{display:block;width:100%;min-height:48px;font-size:16px;color:#fff;background:#181120;border:1px solid #7c3aed;border-radius:10px;-webkit-appearance:auto;appearance:auto;touch-action:manipulation}.ok{margin-top:12px;color:#86efac;font-size:13px}</style></head><body><h1>Teste nativo de arquivo — iPhone</h1><p>Esta página não usa nenhum JavaScript para abrir o seletor. O toque vai direto no controle nativo do iOS.</p><div class="box"><b>Fotos / imagens</b><input id="photo" type="file" accept="image/*,.png,.jpg,.jpeg,.webp,.heic,.heif"><div id="photoStatus" class="ok"></div></div><div class="box"><b>Arquivos / ZIP</b><input id="file" type="file" accept=".zip,application/zip,application/x-zip-compressed,.png,.jpg,.jpeg,.webp,.heic,.heif"><div id="fileStatus" class="ok"></div></div><script>photo.onchange=()=>photoStatus.textContent=photo.files[0]?'Selecionado: '+photo.files[0].name:'';file.onchange=()=>fileStatus.textContent=file.files[0]?'Selecionado: '+file.files[0].name:'';</script></body></html>
